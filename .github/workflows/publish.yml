name: Publish to PyPI
# Fires on a version tag (v0.3.0). Uses PyPI trusted publishing (no token in the repo): register
# this workflow once at https://pypi.org/manage/account/publishing/ with owner dannyshafer,
# repository agentic-guardrails, workflow publish.yml, environment pypi. The tag must match
# pyproject's version; the check below refuses a mismatch so a stray tag cannot publish.
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: pip install build && python -m build
      - run: pip install -e ".[dev]" && pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
